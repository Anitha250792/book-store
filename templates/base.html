{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>
        {% block title %}
        Inkleaf Book House | Stories Bound, Minds Opened
        {% endblock %}
    </title>


    <meta
        name="description"
        content="{% block description %}Inkleaf Book House is a curated bookstore in Chennai — fiction, business, self-development, children's books and more, with same-day delivery and WhatsApp ordering.{% endblock %}"
    >


    <meta
        name="keywords"
        content="bookstore Chennai, buy books online Chennai, Inkleaf Book House, fiction books, self development books, children's books Chennai"
    >


    <meta
        name="author"
        content="Inkleaf Book House"
    >


    <meta
        name="whatsapp-number"
        content="{{ business.phone_link }}"
    >


    <!-- Open Graph -->
    <meta
        property="og:title"
        content="Inkleaf Book House | Stories Bound, Minds Opened"
    >

    <meta
        property="og:description"
        content="A curated independent bookstore in Chennai, with same-day delivery."
    >

    <meta
        property="og:type"
        content="website"
    >


    <!-- Favicon -->
    <link
        rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📖%3C/text%3E%3C/svg%3E"
    >


    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap"
        rel="stylesheet"
    >


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    >


    <!-- AOS Animation -->

    <link
        href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css"
        rel="stylesheet"
    >


    <!-- Swiper -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    >


    <!-- YOUR CUSTOM CSS -->

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >


    {% block extra_css %}
    {% endblock %}

</head>


<body>


    <!-- NAVBAR -->

    {% include "store/navbar.html" %}


    <!-- MAIN CONTENT -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- FOOTER -->

    {% include "store/footer.html" %}


    <!-- FLOATING ACTION BUTTONS -->

    <div class="floating-actions">


        <!-- WhatsApp -->

        <a
            href="https://wa.me/{{ business.phone_link }}?text={{ business.whatsapp_default_message|urlencode }}"
            class="floating-btn floating-whatsapp"
            target="_blank"
            rel="noopener"
            aria-label="Chat on WhatsApp"
            data-tooltip="WhatsApp"
        >

            <i class="bi bi-whatsapp"></i>

        </a>


        <!-- Call -->

        <a
            href="tel:+{{ business.phone_link }}"
            class="floating-btn floating-call"
            aria-label="Call us"
            data-tooltip="Call"
        >

            <i class="bi bi-telephone-fill"></i>

        </a>


        <!-- Instagram -->

        <a
            href="{{ business.instagram }}"
            class="floating-btn floating-insta"
            target="_blank"
            rel="noopener"
            aria-label="Instagram"
            data-tooltip="Instagram"
        >

            <i class="bi bi-instagram"></i>

        </a>


    </div>


    <!-- SCROLL TO TOP -->

    <button
        id="scrollTopBtn"
        aria-label="Scroll to top"
    >

        <i class="bi bi-arrow-up"></i>

    </button>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- AOS JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"
    ></script>


    <!-- Swiper JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"
    ></script>


    <!-- YOUR CUSTOM JS -->

    <script
        src="{% static 'js/main.js' %}"
    ></script>


    {% block extra_js %}
    {% endblock %}


</body>

</html>
