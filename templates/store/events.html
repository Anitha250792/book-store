<section class="events-section" id="events">
    <div class="container">
        <div class="section-head" data-aos="fade-up">
            <span class="eyebrow">What's Happening</span>
            <h2 class="section-heading">Events at the store</h2>
        </div>

        <div class="events-grid">
            {% for event in events %}
            <div class="event-card" data-aos="fade-up" data-aos-delay="{{ forloop.counter0|add:'0' }}0">
                <div class="event-date">
                    <span class="event-day">{{ event.date }}</span>
                    <span class="event-time">{{ event.time }}</span>
                </div>
                <h3>{{ event.title }}</h3>
                <p>{{ event.description }}</p>
                <span class="event-location"><i class="bi bi-geo-alt"></i> {{ event.location }}</span>
                <a href="https://wa.me/{{ business.phone_link }}?text={{ business.whatsapp_default_message|urlencode }}" target="_blank" rel="noopener" class="event-cta">
                    Enquire <i class="bi bi-arrow-right"></i>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
