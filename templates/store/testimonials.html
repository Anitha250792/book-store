<section class="testimonials-section" id="reviews">
    <div class="container">
        <div class="section-head text-center" data-aos="fade-up">
            <span class="eyebrow eyebrow-center">Reader Stories</span>
            <h2 class="section-heading">What our readers say</h2>
        </div>

        <div class="swiper testimonial-swiper" data-aos="fade-up">
            <div class="swiper-wrapper">
                {% for t in testimonials %}
                <div class="swiper-slide">
                    <div class="testimonial-card">
                        <i class="bi bi-quote quote-icon"></i>
                        <div class="testimonial-rating">
                            {% for i in "12345" %}
                                {% if forloop.counter <= t.rating %}<i class="bi bi-star-fill"></i>{% else %}<i class="bi bi-star"></i>{% endif %}
                            {% endfor %}
                        </div>
                        <p>&ldquo;{{ t.text }}&rdquo;</p>
                        <div class="testimonial-person">
                            <img src="{{ t.avatar }}" alt="{{ t.name }}" loading="lazy">
                            <div>
                                <strong>{{ t.name }}</strong>
                                <span>{{ t.type }}</span>
                            </div>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
            <div class="swiper-pagination"></div>
        </div>
    </div>
</section>
